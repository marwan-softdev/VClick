name: Cut a version release

# The appimage/linux-packages/source-packages workflows build and smoke-test
# on every push, but publish nothing themselves -- otherwise GitHub would
# accumulate a "latest build" release per push, which is what this replaced.
#
# This is the only thing that actually publishes a release: it takes this
# commit's already-built, already-tested artifacts from those three
# workflows and publishes them together under a version tag, taken from
# vclick/__init__.py's __version__ (the single source of truth --
# pyproject.toml reads its own version from the same attribute), then
# re-points the website's download links at that same tag.
#
# A "0.y.z" version is published as a GitHub pre-release labeled "(Beta)"
# instead of a polished stable release -- VClick hasn't shipped a stable
# 1.0 yet, so a snapshot cut today shouldn't claim to be one. Once
# __version__ reaches "1.0.0" or higher, this switches to a normal,
# non-prerelease release marked as the repo's "Latest".
#
# The version tag is deliberately *not* a free-text input: it's read from
# the code so cutting a new release forces an actual version bump first,
# rather than a label someone can type without touching anything. If
# "vX.Y.Z" already exists as a release, this fails instead of silently
# re-publishing over it -- bump __version__ in vclick/__init__.py and
# push that before running this again.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version to release
        id: version
        run: |
          raw_version="$(python3 -c 'import vclick; print(vclick.__version__)')"
          version="v$raw_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$raw_version" | cut -d. -f1)" = "0" ]; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $version as a beta pre-release"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "Releasing $version as the stable latest release"
          fi

      - name: Refuse to re-cut an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.version }} has already been released." \
                 "Bump __version__ in vclick/__init__.py, push it to main, then re-run this workflow."
            exit 1
          fi

      - name: Download this commit's build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for workflow in appimage.yml linux-packages.yml source-packages.yml; do
            run_id="$(gh run list --repo "${{ github.repository }}" --workflow "$workflow" \
              --limit 20 --json databaseId,headSha,status,conclusion --jq \
              "[.[] | select(.headSha == \"${{ github.sha }}\" and .status == \"completed\" and .conclusion == \"success\")][0].databaseId")"
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "::error::No successful run of $workflow found for commit ${{ github.sha }}." \
                   "Wait for CI on this commit to finish, then re-run this workflow."
              exit 1
            fi
            echo "Downloading artifacts from $workflow run $run_id"
            gh run download "$run_id" --repo "${{ github.repository }}" -D "tmp-dl"
            find "tmp-dl" -type f -exec mv {} dist/ \;
            rm -rf "tmp-dl"
          done
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if [ "$BETA" = "true" ]; then
            gh release create "$VERSION" dist/* \
              --repo "${{ github.repository }}" \
              --title "VClick $VERSION (Beta)" \
              --notes "Beta snapshot of VClick $VERSION, built from commit ${{ github.sha }}. Includes the Linux AppImage, .deb/.rpm packages, and source packages for Linux and Windows. VClick hasn't reached a stable 1.0 release yet -- expect rough edges." \
              --prerelease
          else
            gh release create "$VERSION" dist/* \
              --repo "${{ github.repository }}" \
              --title "VClick $VERSION" \
              --notes "Stable snapshot of VClick $VERSION, built from commit ${{ github.sha }}. Includes the Linux AppImage, .deb/.rpm packages, and source packages for Linux and Windows." \
              --latest
          fi

      - name: Point the website at this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages gh-pages-wt origin/gh-pages
          cd gh-pages-wt
          sed -i -E "s#(releases/download/)v[0-9]+\.[0-9]+\.[0-9]+(/)#\1${VERSION}\2#g" index.html
          if git diff --quiet; then
            echo "Website already points at $VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Point downloads at $VERSION"
            git push origin gh-pages
          fi

      - name: Point README's release links at this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E "s#(releases/tag/)v[0-9]+\.[0-9]+\.[0-9]+#\1${VERSION}#g" README.md
          if git diff --quiet; then
            echo "README already points at $VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Point README's release links at $VERSION"
            git push origin HEAD:main
          fi
