name: Build AppImage

on:
  push:
    branches:
      - main
    paths:
      - "vclick/**"
      - "pyproject.toml"
      - "packaging/appimage/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp build info
        run: python packaging/stamp_build_info.py appimage

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Smoke-test the bundled runtime
        # Confirms the AppImage's own bundled Python actually has a working
        # Tkinter (the one thing python-appimage's manylinux base image
        # wasn't locally verifiable to include) and that VClick itself
        # imports and runs inside it -- not just that the file exists.
        run: |
          cd packaging/appimage
          appimage="$(ls VisualClick-*.AppImage)"
          chmod +x "$appimage"
          "./$appimage" --appimage-extract >/dev/null
          out="$(./squashfs-root/AppRun --check)"
          echo "$out"
          echo "$out" | grep -q "tkinter      : available"
          echo "$out" | grep -q "mss (capture): available"

      - uses: actions/upload-artifact@v4
        with:
          name: VClick-AppImage
          path: packaging/appimage/VisualClick-*.AppImage
          if-no-files-found: error

      - name: Publish as a release asset
        # End users should get one finished file, not a source zip they have
        # to build themselves -- so the AppImage also gets attached to a
        # rolling release, giving it a stable, direct download URL that's
        # entirely separate from the branch's source zip (which still has
        # install.sh + this build tooling in it, for the terminal-install
        # path). Re-running this updates that same release's asset in place
        # rather than creating a new one each time.
        #
        # Tag is branch-scoped (not a generic "appimage-latest") because a
        # generic tag collided with an unrelated pre-existing release from
        # a different branch on the first attempt at this -- see repo
        # history around 2026-08-21 if that ever needs revisiting.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appimage-latest-screen-change-q8eylj
          name: VClick AppImage (latest build, screen-change-auto-click-q8eylj)
          body: |
            Automatically built from commit ${{ github.sha }} by the
            `Build AppImage` workflow. Download the `.AppImage` file below,
            mark it executable, and run it -- no install step, no root.
          prerelease: true
          files: packaging/appimage/VisualClick-*.AppImage
