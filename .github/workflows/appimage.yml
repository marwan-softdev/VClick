name: Build AppImage

on:
  push:
    branches:
      - claude/screen-change-auto-click-q8eylj
    paths:
      - "screenwatch/**"
      - "pyproject.toml"
      - "packaging/appimage/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Smoke-test the bundled runtime
        # Confirms the AppImage's own bundled Python actually has a working
        # Tkinter (the one thing python-appimage's manylinux base image
        # wasn't locally verifiable to include) and that ScreenWatch itself
        # imports and runs inside it -- not just that the file exists.
        run: |
          cd packaging/appimage
          appimage="$(ls ScreenWatch-*.AppImage)"
          chmod +x "$appimage"
          "./$appimage" --appimage-extract >/dev/null
          out="$(./squashfs-root/AppRun --check)"
          echo "$out"
          echo "$out" | grep -q "tkinter      : available"
          echo "$out" | grep -q "mss (capture): available"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWatch-AppImage
          path: packaging/appimage/ScreenWatch-*.AppImage
          if-no-files-found: error
