name: Build AppImage

# Builds and smoke-tests the AppImage on every push that touches it, so a
# broken build is caught immediately -- but doesn't publish anything itself.
# The artifact uploaded below is what "Cut a version release" pulls from
# when a maintainer deliberately bumps vclick.__version__ and cuts a real
# release; nothing here runs on every commit.
on:
  push:
    branches:
      - main
    paths:
      - "vclick/**"
      - "pyproject.toml"
      - "packaging/appimage/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp build info
        run: python packaging/stamp_build_info.py appimage

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Smoke-test the bundled runtime
        # Confirms the AppImage's own bundled Python actually has a working
        # Tkinter (the one thing python-appimage's manylinux base image
        # wasn't locally verifiable to include) and that VClick itself
        # imports and runs inside it -- not just that the file exists.
        run: |
          cd packaging/appimage
          appimage="$(ls VisualClick-*.AppImage)"
          chmod +x "$appimage"
          "./$appimage" --appimage-extract >/dev/null
          out="$(./squashfs-root/AppRun --check)"
          echo "$out"
          echo "$out" | grep -q "tkinter      : available"
          echo "$out" | grep -q "mss (capture): available"

      - uses: actions/upload-artifact@v4
        with:
          name: VClick-AppImage
          path: packaging/appimage/VisualClick-*.AppImage
          if-no-files-found: error
