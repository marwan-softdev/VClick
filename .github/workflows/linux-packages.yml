name: Build Linux .deb/.rpm packages

# Builds and smoke-tests both packages on every push that touches them, so a
# broken build is caught immediately -- but doesn't publish anything itself.
# The artifact uploaded below is what "Cut a version release" pulls from
# when a maintainer deliberately bumps vclick.__version__ and cuts a real
# release; nothing here runs on every commit.
on:
  push:
    branches:
      - main
    paths:
      - "vclick/**"
      - "pyproject.toml"
      - "packaging/linux-packages/**"
      - ".github/workflows/linux-packages.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp build info
        run: python packaging/stamp_build_info.py linux-packages

      - name: Install packaging tools (fpm, rpmbuild)
        # fpm is a Ruby gem, not a Python package -- ubuntu-latest ships a
        # usable Ruby already. rpmbuild itself isn't preinstalled and is
        # needed even just to *build* (not install) an .rpm with fpm.
        run: |
          sudo gem install --no-document fpm
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build .deb and .rpm
        run: bash packaging/linux-packages/build-linux-packages.sh

      - name: Smoke-test both packages
        # Installs each package for real and runs the installed `vclick`
        # binary's --check, the same bar the AppImage and (former)
        # Windows .exe builds are held to: not just "the file exists",
        # but "the installed app's bundled Tkinter/mss actually work".
        run: |
          set -e
          sudo dpkg -i packaging/linux-packages/VClick-x86_64.deb
          out="$(vclick --check)"
          echo "$out"
          echo "$out" | grep -q "tkinter      : available"
          echo "$out" | grep -q "mss (capture): available"
          sudo dpkg -r vclick

          sudo rpm -i --nodeps packaging/linux-packages/VClick-x86_64.rpm
          out="$(vclick --check)"
          echo "$out"
          echo "$out" | grep -q "tkinter      : available"
          echo "$out" | grep -q "mss (capture): available"
          sudo rpm -e vclick

      - uses: actions/upload-artifact@v4
        with:
          name: VClick-linux-packages
          path: |
            packaging/linux-packages/VClick-x86_64.deb
            packaging/linux-packages/VClick-x86_64.rpm
          if-no-files-found: error
