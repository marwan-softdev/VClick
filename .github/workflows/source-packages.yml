name: Build source packages

on:
  push:
    branches:
      - main
    paths:
      - "vclick/**"
      - "tests/**"
      - "assets/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "install.sh"
      - "install.bat"
      - "run.sh"
      - "run.bat"
      - "README.md"
      - "LICENSE"
      - ".gitattributes"
      - "packaging/source-packages/**"
      - ".github/workflows/source-packages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build info
        # ubuntu-latest ships a system python3, and the stamping script is
        # stdlib-only, so no actions/setup-python step is needed just for
        # this. build-source-zips.sh's git-archive step doesn't see this
        # on-disk stamp by itself -- it copies the stamped file back in
        # afterward (see that script).
        run: python3 packaging/stamp_build_info.py source-packages

      - name: Build the Linux-only and Windows-only source zips
        run: bash packaging/source-packages/build-source-zips.sh

      - name: Sanity-check each zip has no trace of the other platform
        run: |
          cd packaging/source-packages
          echo "-- linux zip --"
          unzip -l VClick-linux-source.zip | grep -E "install\.sh|run\.sh"
          ! unzip -l VClick-linux-source.zip | grep -qE "install\.bat|run\.bat"
          echo "-- windows zip --"
          unzip -l VClick-windows-source.zip | grep -E "install\.bat|run\.bat"
          ! unzip -l VClick-windows-source.zip | grep -qE "install\.sh|run\.sh|\.desktop"
          echo "-- neither zip has the AppImage build tooling --"
          ! unzip -l VClick-linux-source.zip | grep -qE "packaging/|\.github/"
          ! unzip -l VClick-windows-source.zip | grep -qE "packaging/|\.github/"

      - uses: actions/upload-artifact@v4
        with:
          name: VClick-source-packages
          path: packaging/source-packages/VClick-*-source.zip
          if-no-files-found: error

      - name: Publish as release assets
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: source-packages-latest-screen-change-q8eylj
          name: VClick source packages (latest build, screen-change-auto-click-q8eylj)
          body: |
            Automatically built from commit ${{ github.sha }} by the
            `Build source packages` workflow. Two separate zips: one with
            `install.sh`/`run.sh` for Linux, one with `install.bat`/`run.bat`
            for Windows -- neither contains the other platform's installer.
          prerelease: true
          files: packaging/source-packages/VClick-*-source.zip
