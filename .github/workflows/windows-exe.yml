name: Build Windows exe

on:
  push:
    branches:
      - claude/screen-change-auto-click-q8eylj
    paths:
      - "screenwatch/**"
      - "pyproject.toml"
      - "packaging/windows-exe/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build a console-mode build for verification only (not shipped)
        # --windowed builds have no stdout at all (GUI-subsystem executables
        # get no console/stdio handles), so the real diagnostics can't be
        # read back from them. This throwaway console build uses the exact
        # same imports/bundled files as the real one, just without the
        # --windowed flag, so its --check output proves the bundle actually
        # works (Tkinter, mss, etc. all import correctly) before the real
        # windowed .exe gets built and shipped.
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          pyinstaller --onefile --console --noconfirm --name ScreenWatch-check --add-data "screenwatch\assets;screenwatch\assets" --hidden-import mss.windows --hidden-import pynput.mouse._win32 --hidden-import pynput.keyboard._win32 --distpath packaging\windows-exe\check-dist screenwatch\__main__.py

      - name: Smoke-test the bundled runtime
        shell: cmd
        run: |
          packaging\windows-exe\check-dist\ScreenWatch-check.exe --check > check-output.txt
          type check-output.txt
          findstr /C:"tkinter      : available" check-output.txt
          if errorlevel 1 exit /b 1
          findstr /C:"mss (capture): available" check-output.txt
          if errorlevel 1 exit /b 1

      - name: Build the real, windowed .exe
        shell: cmd
        run: packaging\windows-exe\build-exe.bat

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWatch-windows-exe
          path: packaging/windows-exe/dist/ScreenWatch.exe
          if-no-files-found: error

      - name: Publish as a release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-exe-latest-screen-change-q8eylj
          name: ScreenWatch Windows .exe (latest build, screen-change-auto-click-q8eylj)
          body: |
            Automatically built from commit ${{ github.sha }} by the
            `Build Windows exe` workflow. A standalone `ScreenWatch.exe` --
            bundled Python, Tkinter, and every dependency. No separate
            Python install needed, no console window.
          prerelease: true
          files: packaging/windows-exe/dist/ScreenWatch.exe
